<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lin Nora · Designer · Oslo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --bg: #FFFFFF;
    --bg-soft: #F2F1EF;
    --ink: #0E0E0C;
    --ink-2: #2A2A26;
    --muted: #8A8780;
    --line: #1a1a1a;
    --line-soft: rgba(14,14,12,0.14);
    --dashed: rgba(14,14,12,0.28);
    --accent: #0E0E0C;
    --card: #FFFFFF;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .dots-bg { background-image: radial-gradient(circle, var(--dashed) 1px, transparent 1px); background-size: 14px 14px; }
  .pf-artboard { background: var(--bg); color: var(--ink); }

  /* homepage reel: horizontal scroller without a visible scrollbar */
  .pf-reel { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .pf-reel::-webkit-scrollbar { display: none; }
  .pf-reel a { -webkit-user-drag: none; }
  @keyframes threadIn { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes reelIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

  /* underline that draws in on hover */
  .pf-ulink { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .35s cubic-bezier(.2,.8,.2,1); padding-bottom: 2px; }
  .pf-ulink:hover { background-size: 100% 1px; }
  /* arrow nudges right on hover */
  .pf-arrow span { display: inline-block; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .pf-arrow:hover span { transform: translateX(4px); }
  /* featured rows invert on hover; let their text follow the colour swap */
  .pf-feat h3, .pf-feat p, .pf-feat span, .pf-feat a { transition: color .45s ease, border-color .45s ease, background-color .45s ease; }
  .pf-feat .pf-arrow span { transition: transform .3s cubic-bezier(.2,.8,.2,1), color .45s ease; }
  .pf-circle:not(:disabled):hover { background: var(--ink) !important; color: var(--bg) !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* offset anchor targets so they don't hide behind the sticky nav */
  section[id] { scroll-margin-top: 80px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    window.THREE = THREE;
    window.dispatchEvent(new CustomEvent("carbon-three-ready"));
  </script>

  <script src="assets/brand/dotted-logo.js?v=2"></script>
  <script src="portfolio-core.js?v=70"></script>
  <script src="portfolio-sections.js?v=125"></script>

  <script src="portfolio-home.js?v=36"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lin Nora · Designer · Oslo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *,*::before,*::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --bg: #FAFAF7;
    --bg-soft: #F3F1EB;
    --ink: #0E0E0C;
    --ink-2: #2A2A26;
    --muted: #8A8780;
    --line: #1a1a1a;
    --line-soft: rgba(14,14,12,0.14);
    --dashed: rgba(14,14,12,0.28);
    --accent: #0E0E0C;
    --card: #FFFFFF;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .dots-bg { background-image: radial-gradient(circle, var(--dashed) 1px, transparent 1px); background-size: 14px 14px; }
  .pf-artboard { background: var(--bg); color: var(--ink); }

  /* offset anchor targets so they don't hide behind the sticky nav */
  section[id] { scroll-margin-top: 80px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    window.THREE = THREE;
    window.dispatchEvent(new CustomEvent("carbon-three-ready"));
  </script>

  <script src="assets/brand/dotted-logo.js"></script>
  <script type="text/babel" src="portfolio-core.jsx?v=61"></script>
  <script type="text/babel" src="portfolio-sections.jsx?v=119"></script>

  <script type="text/babel">
    const { useEffect: useEffectPage, useState: useStatePage } = React;

    function StickyNav() {
      const [scrolled, setScrolled] = useStatePage(false);
      const [menuOpen, setMenuOpen] = useStatePage(false);
      const isMobile = useIsMobile();
      useEffectPage(() => {
        const onScroll = () => setScrolled(window.scrollY > 12);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      useEffectPage(() => { if (!isMobile) setMenuOpen(false); }, [isMobile]);

      const linkStyle = {
        color: "var(--ink)", textDecoration: "none",
        fontFamily: "'Hanken Grotesk', sans-serif",
        fontSize: 14, fontWeight: 400, letterSpacing: "-0.005em",
      };
      const link = (href, label) => (
        <a href={href} onClick={() => setMenuOpen(false)} style={linkStyle}>{label}</a>
      );

      return (
        <div style={{ position: "sticky", top: 0, zIndex: 100 }}>
          <nav style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            paddingTop: scrolled || menuOpen ? 18 : 28,
            paddingBottom: scrolled || menuOpen ? 18 : 28,
            paddingLeft: "clamp(24px, 5vw, 48px)", paddingRight: "clamp(24px, 5vw, 48px)",
            background: scrolled || menuOpen ? "rgba(250,250,247,0.92)" : "transparent",
            backdropFilter: scrolled || menuOpen ? "blur(10px) saturate(140%)" : "none",
            WebkitBackdropFilter: scrolled || menuOpen ? "blur(10px) saturate(140%)" : "none",
            borderBottom: scrolled || menuOpen ? "1px solid var(--line-soft)" : "1px solid transparent",
            transition: "padding .3s, background .3s, border-color .3s",
          }}>
            <a href="index.html#top" style={{
              color: "var(--ink)", textDecoration: "none",
              fontFamily: "'Hanken Grotesk', sans-serif",
              fontWeight: 500, fontSize: 14, letterSpacing: "-0.01em",
              display: "inline-flex", alignItems: "center", gap: 8,
            }}>
              Lin Nora Tollefsen
              <DottedLogo size={28} />
            </a>

            {isMobile ? (
              <button
                aria-label={menuOpen ? "Close menu" : "Open menu"}
                onClick={() => setMenuOpen((v) => !v)}
                style={{
                  width: 36, height: 36, padding: 0,
                  border: "1px solid var(--line-soft)", borderRadius: "50%",
                  background: "var(--bg)", cursor: "pointer",
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                }}
              >
                <span style={{ position: "relative", width: 14, height: 10 }}>
                  <span style={{
                    position: "absolute", left: 0, width: "100%", height: 1, background: "var(--ink)",
                    top: menuOpen ? 4.5 : 0,
                    transform: menuOpen ? "rotate(45deg)" : "none",
                    transition: "top .25s cubic-bezier(.2,.8,.2,1), transform .25s cubic-bezier(.2,.8,.2,1)",
                  }} />
                  <span style={{
                    position: "absolute", left: 0, width: "100%", height: 1, background: "var(--ink)",
                    top: menuOpen ? 4.5 : 9,
                    transform: menuOpen ? "rotate(-45deg)" : "none",
                    opacity: menuOpen ? 1 : 1,
                    transition: "top .25s cubic-bezier(.2,.8,.2,1), transform .25s cubic-bezier(.2,.8,.2,1)",
                  }} />
                </span>
              </button>
            ) : (
              <div style={{ display: "flex", gap: 40 }}>
                {link("about.html", "About")}
                {link("#work", "Projects")}
                {link("#contact", "Connect")}
              </div>
            )}
          </nav>

          {isMobile && (
            <div style={{
              maxHeight: menuOpen ? 220 : 0,
              overflow: "hidden",
              background: "rgba(250,250,247,0.97)",
              backdropFilter: "blur(10px) saturate(140%)",
              WebkitBackdropFilter: "blur(10px) saturate(140%)",
              borderBottom: menuOpen ? "1px solid var(--line-soft)" : "1px solid transparent",
              transition: "max-height .35s cubic-bezier(.2,.8,.2,1), border-color .35s",
            }}>
              <div style={{
                display: "flex", flexDirection: "column", gap: 20,
                padding: "8px clamp(24px, 5vw, 48px) 28px",
              }}>
                {link("about.html", "About")}
                {link("#work", "Projects")}
                {link("#contact", "Connect")}
              </div>
            </div>
          )}
        </div>
      );
    }

    function PageApp() {
      useEffectPage(() => {
        if (document.getElementById("__pf_kf")) return;
        const s = document.createElement("style");
        s.id = "__pf_kf"; s.textContent = KEYFRAMES;
        document.head.appendChild(s);
      }, []);

      // Save scroll position continuously so a project page's back button can
      // return here at exactly the right spot. The browser's own scroll
      // restoration fires before this client-rendered content exists (the
      // page starts as an empty <div id="root">), so it has nothing to
      // scroll into and silently clamps to 0 — this restores manually once
      // the content (and any video/image layout) has settled instead.
      useEffectPage(() => {
        const KEY = "pf:scrollY:index";
        let raf = null;
        const onScroll = () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            sessionStorage.setItem(KEY, String(window.scrollY));
            raf = null;
          });
        };
        window.addEventListener("scroll", onScroll, { passive: true });

        const saved = parseInt(sessionStorage.getItem(KEY) || "0", 10);
        if (saved > 0) {
          const restore = () => window.scrollTo({ top: saved, behavior: "instant" });
          requestAnimationFrame(restore);
          setTimeout(restore, 60);
          setTimeout(restore, 250);
        }

        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const noHover = () => {};
      return (
        <div className="pf-artboard" data-bg="warm">
          <StickyNav />

          {/* HERO — minimum height to fill viewport below sticky nav */}
          <div style={{ minHeight: "calc(100vh - 86px)" }}>
            <Hero onHover={noHover} />
          </div>

          {/* PROJECTS — tabbed, all 3 categories in one section */}
          <Reveal threshold={0.05}>
            <Projects onHover={noHover} />
          </Reveal>

          {/* CONNECT */}
          <Reveal threshold={0.05}>
            <div style={{ minHeight: "80vh" }}>
              <Footer onHover={noHover} />
            </div>
          </Reveal>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PageApp />);
  </script>
</body>
</html>

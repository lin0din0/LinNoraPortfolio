<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .hover-box {
    position: relative;
    width: 480px;
    max-width: 82vw;
    aspect-ratio: 928 / 640; /* open crop's ratio; keeps everything proportional at any size */
    container-type: inline-size;
    cursor: pointer;
  }

  .box-img {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 100%;
    height: auto;
    transition: opacity 0.35s ease, transform 0.35s ease;
    user-select: none;
    -webkit-user-drag: none;
  }

  .box-closed {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    transition-delay: 0.05s;
  }

  .box-open {
    opacity: 0;
    transform: translateX(-50%) translateY(8px) scale(0.97);
  }

  .hover-box:hover .box-closed,
  .hover-box:focus-visible .box-closed {
    opacity: 0;
    transform: translateX(-50%) translateY(-6px) scale(0.97);
    transition-delay: 0s;
  }

  .hover-box:hover .box-open,
  .hover-box:focus-visible .box-open {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    transition-delay: 0.05s;
  }

  .label {
    position: absolute;
    inset: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .label-closed {
    opacity: 1;
    transition-delay: 0.05s;
  }

  .label-open {
    opacity: 0;
  }

  .hover-box:hover .label-closed,
  .hover-box:focus-visible .label-closed {
    opacity: 0;
    transition-delay: 0s;
  }

  .hover-box:hover .label-open,
  .hover-box:focus-visible .label-open {
    opacity: 1;
    transition-delay: 0.05s;
  }

  .label span {
    position: absolute;
    display: block;
    font-family: "Hanken Grotesk", sans-serif;
    font-weight: 500;
    color: #2d2d2d;
    text-align: center;
    white-space: nowrap;
  }

  /* positions/sizes measured from the source illustration, as % of the box container */
  .label-closed .line1 { left: 75.4%; top: 74.6%; width: 13.4%; font-size: 1.65cqw; }
  .label-closed .line2 { left: 77.65%; top: 78.9%; width: 9%; font-size: 1.65cqw; }

  .label-open .line1 { left: 75.3%; top: 76.4%; width: 14%; font-size: 1.85cqw; }
  .label-open .line2 { left: 77.6%; top: 80.6%; width: 9.5%; font-size: 1.85cqw; }

  .icons {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .icon {
    position: absolute;
    left: 50%;
    top: 32%;
    width: var(--w, 11cqw);
    height: auto;
    transform: translate(-50%, -50%) scale(0.15) rotate(0deg);
    opacity: 0;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
    transition: transform 0.35s ease, opacity 0.3s ease;
    user-select: none;
    -webkit-user-drag: none;
  }

  .hover-box:hover .icon,
  .hover-box:focus-visible .icon {
    opacity: 1;
    transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1);
    transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) var(--delay, 0s),
                opacity 0.4s ease var(--delay, 0s);
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="hover-box" tabindex="0" aria-label="Verktøykasse, hover for å åpne">
      <img class="box-img box-closed" src="assets/box-closed.png" alt="Lukket verktøykasse">
      <img class="box-img box-open" src="assets/box-open.png" alt="Åpen verktøykasse">

      <div class="label label-closed">
        <span class="line1">Lin Nora´s toolkit</span>
        <span class="line2">Oslo,Norway</span>
      </div>
      <div class="label label-open">
        <span class="line1">Lin Nora´s toolkit</span>
        <span class="line2">Oslo,Norway</span>
      </div>

      <div class="icons">
        <img class="icon" style="--tx:-31cqw; --ty:-43cqw; --rot:-11deg; --w:15cqw; --delay:0s"    src="assets/icons/figma.png" alt="Figma">
        <img class="icon" style="--tx:17cqw;  --ty:-49cqw; --rot:9deg;   --w:15cqw; --delay:0.05s" src="assets/icons/miro.svg" alt="Miro">
        <img class="icon" style="--tx:-3cqw;  --ty:-53cqw; --rot:-5deg;  --w:15cqw; --delay:0.1s"  src="assets/icons/notion.png" alt="Notion">
        <img class="icon" style="--tx:14cqw;  --ty:-25cqw; --rot:6deg;   --w:13cqw; --delay:0.03s" src="assets/icons/claude.png" alt="Claude">
        <img class="icon" style="--tx:39cqw;  --ty:-19cqw; --rot:-13deg; --w:11cqw; --delay:0.08s" src="assets/icons/illustrator.png" alt="Illustrator">
        <img class="icon" style="--tx:-26cqw; --ty:-24cqw; --rot:-19deg; --w:10cqw; --delay:0.13s" src="assets/icons/cursor.png" alt="Cursor">
        <img class="icon" style="--tx:33cqw;  --ty:-35cqw; --rot:12deg;  --w:10cqw; --delay:0.16s" src="assets/icons/excel.svg" alt="Excel">
        <img class="icon" style="--tx:-42cqw; --ty:-18cqw; --rot:15deg;  --w:10cqw; --delay:0.2s"  src="assets/icons/github.svg" alt="GitHub">
        <img class="icon" style="--tx:-9cqw;  --ty:-30cqw; --rot:-17deg; --w:10cqw; --delay:0.23s" src="assets/icons/lovable.png" alt="Lovable">
      </div>
    </div>
  </div>

</body>
</html>

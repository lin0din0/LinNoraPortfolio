<title>Special Delivery</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .envelope {
    position: relative;
    width: min(560px, 90vw);
    aspect-ratio: 1 / 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transform: scale(1) translateY(0);
    filter: drop-shadow(0 10px 16px rgba(20, 18, 14, 0.08));
    transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1),
                filter 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    will-change: transform;
  }

  .envelope:hover,
  .envelope:focus-visible {
    transform: scale(1.015) translateY(-3px);
    filter: drop-shadow(0 22px 26px rgba(20, 18, 14, 0.14));
  }

  .envelope img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    will-change: opacity, filter;
    transition: opacity 0.7s cubic-bezier(0.65, 0, 0.35, 1),
                filter 0.7s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .envelope .closed {
    opacity: 1;
    filter: blur(0px);
  }

  .envelope .open {
    opacity: 0;
    filter: blur(3px);
  }

  .envelope:hover .closed,
  .envelope:focus-visible .closed {
    opacity: 0;
    filter: blur(3px);
  }

  .envelope:hover .open,
  .envelope:focus-visible .open {
    opacity: 1;
    filter: blur(0px);
  }

  .envelope:focus-visible {
    outline: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .envelope,
    .envelope .closed,
    .envelope .open {
      transition: opacity 0.2s linear !important;
      transform: none !important;
      filter: none !important;
    }
  }
</style>

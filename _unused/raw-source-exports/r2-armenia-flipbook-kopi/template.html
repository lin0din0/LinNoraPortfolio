<meta charset="utf-8">
<title>R2 Armenia Report</title>
<style>
:root{
  --bg:#e6e7eb;
  --bg2:#d7d9df;
  --book-edge:#f4f3ef;
  --page-bg:#ffffff;
  --ink:#2a2a2e;
  --muted:#6b6d76;
  --accent:#2f5fd8;
  --toolbar-bg:rgba(255,255,255,0.86);
  --toolbar-border:rgba(0,0,0,0.08);
  --btn-bg:#ffffff;
  --btn-bg-hover:#f0f1f4;
  --btn-ink:#33343a;
  --shadow-soft: 0 25px 65px rgba(20,20,30,0.24);
  --spine-shadow: rgba(0,0,0,0.35);
  --nav-arrow-bg: rgba(255,255,255,0.9);
  --nav-arrow-ink:#3a3b42;
  --scrollbar: rgba(0,0,0,0.2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1c20;
    --bg2:#232429;
    --book-edge:#e9e8e4;
    --page-bg:#fdfdfb;
    --ink:#e8e8ec;
    --muted:#a3a4ac;
    --accent:#7ea1ff;
    --toolbar-bg:rgba(30,31,36,0.86);
    --toolbar-border:rgba(255,255,255,0.08);
    --btn-bg:#2b2c32;
    --btn-bg-hover:#35363d;
    --btn-ink:#e8e8ec;
    --shadow-soft: 0 25px 65px rgba(0,0,0,0.5);
    --spine-shadow: rgba(0,0,0,0.6);
    --nav-arrow-bg: rgba(40,41,46,0.85);
    --nav-arrow-ink:#e8e8ec;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1c20;
  --bg2:#232429;
  --book-edge:#e9e8e4;
  --page-bg:#fdfdfb;
  --ink:#e8e8ec;
  --muted:#a3a4ac;
  --accent:#7ea1ff;
  --toolbar-bg:rgba(30,31,36,0.86);
  --toolbar-border:rgba(255,255,255,0.08);
  --btn-bg:#2b2c32;
  --btn-bg-hover:#35363d;
  --btn-ink:#e8e8ec;
  --shadow-soft: 0 25px 65px rgba(0,0,0,0.5);
  --spine-shadow: rgba(0,0,0,0.6);
  --nav-arrow-bg: rgba(40,41,46,0.85);
  --nav-arrow-ink:#e8e8ec;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg) 70%);
  color:var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
}

#app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}

#stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  touch-action:none;
}

#viewport{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
}
#viewport.panning{cursor:grabbing;}
#viewport.zoomed{cursor: default;}

#bookWrap{
  will-change:transform;
  transform-origin:0 0;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

#book{
  position:relative;
  perspective:2600px;
  box-shadow: var(--shadow-soft);
  padding:0;
}

#pages{
  position:relative;
  display:flex;
  overflow:hidden;
  background:#fff;
}

.page-slot{
  position:relative;
  width:100%;
  height:100%;
  background:var(--page-bg);
  overflow:hidden;
}
.page-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  pointer-events:none;
}
.page-slot.empty{
  background:repeating-linear-gradient(135deg, var(--page-bg), var(--page-bg) 18px, #f1f1ee 18px, #f1f1ee 19px);
}

#gutter{
  position:absolute;
  top:0;
  left:50%;
  width:50px;
  height:100%;
  transform:translateX(-25px);
  pointer-events:none;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,0) 0%,
      var(--spine-shadow) 46%,
      rgba(0,0,0,0.55) 50%,
      var(--spine-shadow) 54%,
      rgba(0,0,0,0) 100%);
  opacity:0.35;
  mix-blend-mode:multiply;
  z-index:5;
}

.flip{
  position:absolute;
  top:0;
  width:50%;
  height:100%;
  transform-style:preserve-3d;
  pointer-events:none;
  display:none;
  z-index:20;
  will-change:transform;
}
.flip.right{right:0; transform-origin:left center;}
.flip.left{left:0; transform-origin:right center;}

.flip-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  overflow:hidden;
  background:var(--page-bg);
}
.flip-face img{width:100%;height:100%;object-fit:cover;display:block;}
.flip .flip-back{transform:rotateY(180deg);}

.flip-shade{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
.flip.right .flip-front .flip-shade{
  background:linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0) 55%);
}
.flip.right .flip-back .flip-shade{
  background:linear-gradient(90deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35));
}
.flip.left .flip-front .flip-shade{
  background:linear-gradient(270deg, rgba(0,0,0,0.35), rgba(0,0,0,0) 55%);
}
.flip.left .flip-back .flip-shade{
  background:linear-gradient(270deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35));
}

#dropShadow{
  position:absolute;
  top:2%;
  width:46%;
  height:96%;
  pointer-events:none;
  opacity:0;
  filter:blur(18px);
  background:radial-gradient(closest-side, rgba(0,0,0,0.45), rgba(0,0,0,0));
  z-index:15;
}

.click-zone{
  position:absolute;
  top:0;
  width:50%;
  height:100%;
  z-index:30;
}
.click-zone.left{left:0;}
.click-zone.right{right:0;}
.click-zone:hover{background:rgba(255,255,255,0.03);}

.nav-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  border:none;
  background:var(--nav-arrow-bg);
  color:var(--nav-arrow-ink);
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
  z-index:40;
  opacity:0.85;
  transition:opacity .15s, transform .15s;
}
.nav-arrow:hover{opacity:1; transform:translateY(-50%) scale(1.06);}
.nav-arrow:disabled{opacity:0.25; cursor:default;}
.nav-arrow:disabled:hover{transform:translateY(-50%);}
#navPrev{left:22px;}
#navNext{right:22px;}

#loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  background:var(--bg);
  z-index:100;
  transition:opacity .4s ease;
}
#loading.hidden{opacity:0; pointer-events:none;}
.spinner{
  width:38px;height:38px;
  border-radius:50%;
  border:3px solid rgba(127,127,140,0.25);
  border-top-color:var(--accent);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
#loading span{color:var(--muted); font-size:13px; letter-spacing:0.02em;}

#toolbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 16px;
  background:var(--toolbar-bg);
  border-top:1px solid var(--toolbar-border);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:50;
  flex-wrap:wrap;
}
.tbtn{
  width:34px;height:34px;
  border-radius:8px;
  border:1px solid var(--toolbar-border);
  background:var(--btn-bg);
  color:var(--btn-ink);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:15px;
  transition:background .12s;
}
.tbtn:hover{background:var(--btn-bg-hover);}
.tbtn:disabled{opacity:0.35; cursor:default;}
.tbtn:disabled:hover{background:var(--btn-bg);}
.tbtn svg{width:16px;height:16px;}

#pageInfo{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:var(--ink);
  margin:0 6px;
  white-space:nowrap;
}
#pageInput{
  width:46px;
  text-align:center;
  padding:6px 4px;
  border-radius:8px;
  border:1px solid var(--toolbar-border);
  background:var(--btn-bg);
  color:var(--ink);
  font-size:13px;
}
#pageInput:focus{outline:2px solid var(--accent); outline-offset:1px;}
#pageTotalLabel{color:var(--muted);}

.tsep{
  width:1px;height:22px;
  background:var(--toolbar-border);
  margin:0 6px;
}

#zoomLabel{
  font-size:12px;
  color:var(--muted);
  min-width:38px;
  text-align:center;
}

#progressTrack{
  position:absolute;
  left:0; right:0; bottom:0;
  height:3px;
  background:rgba(127,127,140,0.18);
  z-index:60;
}
#progressFill{
  height:100%;
  background:var(--accent);
  width:0%;
  transition:width .35s ease;
}

#hint{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:var(--muted);
  background:var(--toolbar-bg);
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--toolbar-border);
  z-index:45;
  opacity:0.9;
  pointer-events:none;
  transition:opacity .5s ease;
}
#hint.hidden{opacity:0;}

@media (max-width:640px){
  .nav-arrow{width:40px;height:40px;font-size:18px;}
  #navPrev{left:8px;}
  #navNext{right:8px;}
  #toolbar{gap:4px; padding:8px 8px;}
  .tbtn{width:30px;height:30px;}
  #hint{display:none;}
}
</style>

<div id="app">
  <div id="stage">
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div id="viewport">
      <div id="bookWrap">
        <div id="book">
          <div id="pages">
            <div class="page-slot left" id="slotLeft"><img id="imgLeft" alt=""></div>
            <div class="page-slot right" id="slotRight"><img id="imgRight" alt=""></div>
            <div id="gutter"></div>
            <div id="dropShadow"></div>
            <div class="flip right" id="flipRight">
              <div class="flip-face flip-front"><img id="flipRightFront" alt=""><div class="flip-shade"></div></div>
              <div class="flip-face flip-back"><img id="flipRightBack" alt=""><div class="flip-shade"></div></div>
            </div>
            <div class="flip left" id="flipLeft">
              <div class="flip-face flip-front"><img id="flipLeftFront" alt=""><div class="flip-shade"></div></div>
              <div class="flip-face flip-back"><img id="flipLeftBack" alt=""><div class="flip-shade"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="nav-arrow" id="navPrev" aria-label="Previous page">&#8249;</button>
    <button class="nav-arrow" id="navNext" aria-label="Next page">&#8250;</button>
    <div id="hint">Click the page edges to flip &middot; scroll to zoom &middot; drag to pan</div>
    <div id="loading"><div class="spinner"></div><span>Opening report&hellip;</span></div>
  </div>

  <div id="toolbar">
    <button class="tbtn" id="btnFirst" title="First page">&#8676;</button>
    <button class="tbtn" id="btnPrev" title="Previous">&#8249;</button>
    <div id="pageInfo">
      <input id="pageInput" inputmode="numeric" />
      <span id="pageTotalLabel">/ 105</span>
    </div>
    <button class="tbtn" id="btnNext" title="Next">&#8250;</button>
    <button class="tbtn" id="btnLast" title="Last page">&#8677;</button>
    <div class="tsep"></div>
    <button class="tbtn" id="btnZoomOut" title="Zoom out">&#8722;</button>
    <span id="zoomLabel">100%</span>
    <button class="tbtn" id="btnZoomIn" title="Zoom in">&#43;</button>
    <button class="tbtn" id="btnZoomReset" title="Reset zoom">&#8634;</button>
  </div>
</div>

<script>
(function(){
"use strict";

var PAGES = __PAGES_JSON__; // array of data-URI strings, index 0 = page 1
var TOTAL = PAGES.length;
// page 1 is a standalone cover (state 0); remaining pages pair up as 2-3, 4-5, ...
var PAIR_COUNT = Math.ceil((TOTAL-1)/2) + 1;

function spreadOf(state){
  if(state===0){ return {l:-1, r:0}; }
  var l = state*2-1, r = state*2;
  return {l:l, r:(r<TOTAL? r : -1)};
}

var state = 0;
var maxState = PAIR_COUNT-1;
var animating = false;
var zoom = 1, panX = 0, panY = 0;
var MIN_ZOOM=1, MAX_ZOOM=4;

var viewport = document.getElementById('viewport');
var bookWrap = document.getElementById('bookWrap');
var book = document.getElementById('book');
var pagesEl = document.getElementById('pages');
var slotLeft = document.getElementById('slotLeft');
var slotRight = document.getElementById('slotRight');
var imgLeft = document.getElementById('imgLeft');
var imgRight = document.getElementById('imgRight');
var flipRight = document.getElementById('flipRight');
var flipLeft = document.getElementById('flipLeft');
var flipRightFront = document.getElementById('flipRightFront');
var flipRightBack = document.getElementById('flipRightBack');
var flipLeftFront = document.getElementById('flipLeftFront');
var flipLeftBack = document.getElementById('flipLeftBack');
var dropShadow = document.getElementById('dropShadow');
var gutter = document.getElementById('gutter');
var loading = document.getElementById('loading');
var hint = document.getElementById('hint');
var pageInput = document.getElementById('pageInput');
var zoomLabel = document.getElementById('zoomLabel');
var progressFill = document.getElementById('progressFill');
var navPrev = document.getElementById('navPrev');
var navNext = document.getElementById('navNext');
var btnPrev = document.getElementById('btnPrev');
var btnNext = document.getElementById('btnNext');
var btnFirst = document.getElementById('btnFirst');
var btnLast = document.getElementById('btnLast');
var btnZoomIn = document.getElementById('btnZoomIn');
var btnZoomOut = document.getElementById('btnZoomOut');
var btnZoomReset = document.getElementById('btnZoomReset');

var PAGE_W = 595.32, PAGE_H = 841.92;

function layoutSizes(coverModeOverride){
  var cover = (typeof coverModeOverride === 'boolean') ? coverModeOverride : (state===0);
  var stageW = viewport.clientWidth;
  var stageH = viewport.clientHeight;
  var maxWDouble = stageW * 0.92;
  var maxH = stageH * 0.92;
  var doubleAR = (PAGE_W*2) / PAGE_H;
  var singleAR = PAGE_W / PAGE_H;
  // derive the page height from the double-spread constraint so a single
  // cover page renders at the exact same scale as a page within a spread
  var h = maxWDouble / doubleAR;
  if(h > maxH){ h = maxH; }
  var w = cover ? h*singleAR : h*doubleAR;
  book.style.width = w+'px';
  book.style.height = h+'px';
  var pagesW = w;
  var pagesH = h;
  pagesEl.style.width = pagesW+'px';
  pagesEl.style.height = pagesH+'px';
  if(cover){
    slotLeft.style.display = 'none';
    slotLeft.style.width = '0px';
    slotRight.style.width = pagesW+'px';
    gutter.style.display = 'none';
  } else {
    slotLeft.style.display = '';
    slotLeft.style.width = (pagesW/2)+'px';
    slotRight.style.width = (pagesW/2)+'px';
    gutter.style.display = '';
  }
  slotLeft.style.height = pagesH+'px';
  slotRight.style.height = pagesH+'px';
  flipRight.style.height = pagesH+'px';
  flipLeft.style.height = pagesH+'px';
  dropShadow.style.height = pagesH*0.96+'px';
  applyTransform();
}

function setSlot(imgEl, wrapEl, idx){
  if(idx<0){
    imgEl.removeAttribute('src');
    wrapEl.classList.add('empty');
  } else {
    wrapEl.classList.remove('empty');
    imgEl.src = PAGES[idx];
  }
}

function render(immediate){
  var sp = spreadOf(state);
  setSlot(imgLeft, slotLeft, sp.l);
  setSlot(imgRight, slotRight, sp.r);
  updateUI();
  preloadNeighbors();
}

function updateUI(){
  var sp = spreadOf(state);
  var label;
  if(sp.l<0){ label = String(sp.r+1); }
  else if(sp.r<0){ label = String(sp.l+1); }
  else { label = (sp.l+1)+'\u2013'+(sp.r+1); }
  pageInput.value = label;
  btnPrev.disabled = navPrev.disabled = (state<=0);
  btnFirst.disabled = (state<=0);
  btnNext.disabled = navNext.disabled = (state>=maxState);
  btnLast.disabled = (state>=maxState);
  var pct = Math.round(((sp.l+1)/TOTAL)*100);
  progressFill.style.width = pct+'%';
}

var decodedPages = {};
function preloadPage(i){
  if(i<0 || decodedPages[i]) return;
  decodedPages[i] = true;
  var im = new Image();
  im.src = PAGES[i];
  if(im.decode){ im.decode().catch(function(){}); }
}
function preloadNeighbors(){
  [state-1, state, state+1].forEach(function(s){
    if(s<0 || s>maxState) return;
    var sp = spreadOf(s);
    preloadPage(sp.l);
    preloadPage(sp.r);
  });
}

function easeInOutQuad(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function animateFlip(direction, onDone){
  var duration = 620;
  var start = null;
  var el = direction==='next' ? flipRight : flipLeft;
  var shadeFront = el.querySelector('.flip-front .flip-shade');
  var shadeBack = el.querySelector('.flip-back .flip-shade');
  el.style.display = 'block';
  function step(ts){
    if(start===null) start = ts;
    var t = Math.min(1, (ts-start)/duration);
    var e = easeInOutQuad(t);
    var angle = direction==='next' ? -180*e : 180*e;
    el.style.transform = 'rotateY('+angle+'deg)';
    var shadowPeak = Math.sin(Math.min(1,t)*Math.PI);
    dropShadow.style.opacity = (shadowPeak*0.6).toFixed(3);
    dropShadow.style.left = direction==='next' ? '4%' : '50%';
    shadeFront.style.opacity = Math.min(1, t*2).toFixed(3);
    shadeBack.style.opacity = Math.min(1, (1-t)*2).toFixed(3);
    if(t<1){
      requestAnimationFrame(step);
    } else {
      el.style.display = 'none';
      el.style.transform = 'rotateY(0deg)';
      dropShadow.style.opacity = 0;
      onDone();
    }
  }
  requestAnimationFrame(step);
}

function goNext(){
  if(animating || state>=maxState) return;
  animating = true;
  var cur = spreadOf(state);
  var next = spreadOf(state+1);
  var wasCover = (state===0);
  if(cur.r>=0){ setSlot(imgRight, slotRight, next.r); }
  setSlot(flipRightFront, {classList:{add:function(){},remove:function(){}}}, cur.r);
  setSlot(flipRightBack, {classList:{add:function(){},remove:function(){}}}, next.l);
  if(cur.r<0){
    state = state+1;
    render();
    animating = false;
    return;
  }
  function startFlip(){
    animateFlip('next', function(){
      state = state+1;
      setSlot(imgLeft, slotLeft, next.l);
      updateUI();
      preloadNeighbors();
      animating = false;
    });
  }
  if(wasCover){
    // resizing the frame (single -> double page width) is a real layout
    // reflow; let it paint on its own frame before the rotation starts,
    // otherwise the first frame of the flip stutters
    layoutSizes(false);
    setSlot(imgLeft, slotLeft, next.l);
    requestAnimationFrame(function(){ requestAnimationFrame(startFlip); });
  } else {
    startFlip();
  }
}

function goPrev(){
  if(animating || state<=0) return;
  animating = true;
  var cur = spreadOf(state);
  var prev = spreadOf(state-1);
  var willBeCover = (state-1===0);
  setSlot(imgLeft, slotLeft, prev.l);
  setSlot(flipLeftFront, {classList:{add:function(){},remove:function(){}}}, cur.l);
  setSlot(flipLeftBack, {classList:{add:function(){},remove:function(){}}}, prev.r>=0 ? prev.r : cur.l);
  animateFlip('prev', function(){
    state = state-1;
    var sp = spreadOf(state);
    setSlot(imgRight, slotRight, sp.r);
    if(willBeCover){ layoutSizes(true); }
    updateUI();
    preloadNeighbors();
    animating = false;
  });
}

function goTo(pageNum1indexed){
  var idx = Math.max(0, Math.min(TOTAL-1, pageNum1indexed-1));
  var s = Math.ceil(idx/2);
  s = Math.max(0, Math.min(maxState, s));
  if(s===state) return;
  state = s;
  zoom=1; panX=0; panY=0;
  layoutSizes();
  render();
}

function applyTransform(){
  bookWrap.style.transform = 'translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  zoomLabel.textContent = Math.round(zoom*100)+'%';
  viewport.classList.toggle('zoomed', zoom>1.001);
}

function clampPan(){
  var maxOffset = 400*(zoom);
  panX = Math.max(-maxOffset, Math.min(maxOffset, panX));
  panY = Math.max(-maxOffset*0.6, Math.min(maxOffset*0.6, panY));
}

function setZoom(newZoom, cx, cy){
  newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
  if(cx===undefined){
    var r = viewport.getBoundingClientRect();
    cx = r.width/2; cy = r.height/2;
  }
  var scaleRatio = newZoom/zoom;
  panX = cx - (cx-panX)*scaleRatio;
  panY = cy - (cy-panY)*scaleRatio;
  zoom = newZoom;
  if(zoom<=1){ zoom=1; panX=0; panY=0; }
  clampPan();
  applyTransform();
}

// wheel zoom
viewport.addEventListener('wheel', function(e){
  e.preventDefault();
  var r = viewport.getBoundingClientRect();
  var cx = e.clientX - r.left;
  var cy = e.clientY - r.top;
  var delta = -e.deltaY * 0.0018;
  setZoom(zoom * (1+delta), cx, cy);
}, {passive:false});

// drag to pan / click to flip
var dragging = false, dragMoved = false, dragStartX=0, dragStartY=0, panStartX=0, panStartY=0;
viewport.addEventListener('mousedown', function(e){
  dragging = true; dragMoved = false;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
  viewport.classList.add('panning');
});
window.addEventListener('mousemove', function(e){
  if(!dragging) return;
  var dx = e.clientX-dragStartX, dy = e.clientY-dragStartY;
  if(Math.abs(dx)>4 || Math.abs(dy)>4) dragMoved = true;
  if(zoom>1.001 && dragMoved){
    panX = panStartX+dx; panY = panStartY+dy;
    clampPan();
    applyTransform();
  }
});
window.addEventListener('mouseup', function(e){
  if(!dragging) return;
  dragging = false;
  viewport.classList.remove('panning');
  if(!dragMoved && zoom<=1.001){
    var r = viewport.getBoundingClientRect();
    var x = e.clientX - r.left;
    if(x < r.width/2){ goPrev(); } else { goNext(); }
  }
});

// touch: pinch zoom + pan + tap to flip
var touchState = null;
viewport.addEventListener('touchstart', function(e){
  if(e.touches.length===1){
    touchState = {mode:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY, moved:false, panStartX:panX, panStartY:panY};
  } else if(e.touches.length===2){
    var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    touchState = {mode:'pinch', dist:d, startZoom:zoom, cx:(e.touches[0].clientX+e.touches[1].clientX)/2, cy:(e.touches[0].clientY+e.touches[1].clientY)/2};
  }
}, {passive:true});
viewport.addEventListener('touchmove', function(e){
  if(!touchState) return;
  if(touchState.mode==='pan' && e.touches.length===1){
    var dx = e.touches[0].clientX-touchState.x, dy = e.touches[0].clientY-touchState.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4) touchState.moved = true;
    if(zoom>1.001){
      panX = touchState.panStartX+dx; panY = touchState.panStartY+dy;
      clampPan(); applyTransform();
    }
  } else if(touchState.mode==='pinch' && e.touches.length===2){
    var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    var r = viewport.getBoundingClientRect();
    var cx = touchState.cx-r.left, cy = touchState.cy-r.top;
    setZoom(touchState.startZoom * (d/touchState.dist), cx, cy);
  }
}, {passive:true});
viewport.addEventListener('touchend', function(e){
  if(touchState && touchState.mode==='pan' && !touchState.moved && zoom<=1.001){
    var r = viewport.getBoundingClientRect();
    var x = touchState.x - r.left;
    if(x < r.width/2){ goPrev(); } else { goNext(); }
  }
  touchState = null;
}, {passive:true});

viewport.addEventListener('dblclick', function(e){
  var r = viewport.getBoundingClientRect();
  var cx = e.clientX-r.left, cy = e.clientY-r.top;
  if(zoom>1.001){ setZoom(1, cx, cy); } else { setZoom(2.4, cx, cy); }
});

navPrev.addEventListener('click', goPrev);
navNext.addEventListener('click', goNext);
btnPrev.addEventListener('click', goPrev);
btnNext.addEventListener('click', goNext);
btnFirst.addEventListener('click', function(){ goTo(1); });
btnLast.addEventListener('click', function(){ goTo(TOTAL); });
btnZoomIn.addEventListener('click', function(){ setZoom(zoom+0.5); });
btnZoomOut.addEventListener('click', function(){ setZoom(zoom-0.5); });
btnZoomReset.addEventListener('click', function(){ setZoom(1); });

pageInput.addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    var v = parseInt(pageInput.value, 10);
    if(!isNaN(v)) goTo(v);
    pageInput.blur();
  }
});
pageInput.addEventListener('focus', function(){ pageInput.select(); });

window.addEventListener('keydown', function(e){
  if(document.activeElement===pageInput) return;
  if(e.key==='ArrowRight'){ goNext(); }
  else if(e.key==='ArrowLeft'){ goPrev(); }
  else if(e.key==='+' || e.key==='='){ setZoom(zoom+0.5); }
  else if(e.key==='-'){ setZoom(zoom-0.5); }
  else if(e.key==='0'){ setZoom(1); }
  else if(e.key==='Home'){ goTo(1); }
  else if(e.key==='End'){ goTo(TOTAL); }
});

window.addEventListener('resize', layoutSizes);

setTimeout(function(){ hint.classList.add('hidden'); }, 4500);

function boot(){
  layoutSizes();
  render();
  var first = new Image();
  first.onload = function(){
    setTimeout(function(){ loading.classList.add('hidden'); }, 150);
  };
  first.onerror = function(){ loading.classList.add('hidden'); };
  first.src = PAGES[0];
}
boot();

})();
</script>

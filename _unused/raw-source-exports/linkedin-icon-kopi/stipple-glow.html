<title>Stipple Glow</title>

<style>
  :root {
    --bg: #ffffff;
    --dot: #21232b;
    --dot-hover: #23304f;
    --glow-a: #38bdf8;
    --glow-b: #6366f1;
    --glow-c: #22d3ee;
    --halo: rgba(56,189,248,0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.25rem;
    padding: 3rem;
  }

  .icon-wrap {
    position: relative;
    width: min(46vw, 300px);
    aspect-ratio: 1 / 1;
    cursor: pointer;
  }

  .halo {
    position: absolute;
    inset: -22%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--halo), transparent 68%);
    opacity: 0;
    filter: blur(6px);
    transform: scale(0.85);
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }

  .icon {
    position: relative;
    width: 100%;
    height: 100%;
    transform: scale(1);
    transition: transform 0.45s cubic-bezier(.2,.8,.2,1);
  }

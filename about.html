<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

<style>
  *,*::before,*::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --bg: #FFFFFF;
    --bg-soft: #F2F1EF;
    --ink: #0E0E0C;
    --ink-2: #2A2A26;
    --muted: #8A8780;
    --line: #1a1a1a;
    --line-soft: rgba(14,14,12,0.14);
    --dashed: rgba(14,14,12,0.28);
    --accent: #0E0E0C;
    --card: #FFFFFF;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .pf-artboard { background: var(--bg); color: var(--ink); }

  /* underline that draws in on hover */
  .pf-ulink { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .35s cubic-bezier(.2,.8,.2,1); padding-bottom: 2px; }
  .pf-ulink:hover { background-size: 100% 1px; }
  /* back button fills and nudges left on hover */
  .pf-back { transition: background .25s, color .25s; }
  .pf-back span { display: inline-block; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .pf-backrow:hover .pf-back { background: var(--ink); color: var(--bg); }
  .pf-backrow:hover .pf-back span { transform: translateX(-3px); }
  @keyframes threadIn { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  /* pinned photos: a damped swing around the pin, from the photo's own tilt */
  @keyframes pf-swing {
    0%   { transform: rotate(var(--r)); }
    14%  { transform: rotate(calc(var(--r) + 9deg)); }
    32%  { transform: rotate(calc(var(--r) - 6deg)); }
    50%  { transform: rotate(calc(var(--r) + 3.5deg)); }
    68%  { transform: rotate(calc(var(--r) - 1.8deg)); }
    84%  { transform: rotate(calc(var(--r) + 0.7deg)); }
    100% { transform: rotate(var(--r)); }
  }
  /* sideways photo strip without a visible scrollbar */
  .pf-strip { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .pf-strip::-webkit-scrollbar { display: none; }
  .pf-strip img { -webkit-user-drag: none; }
  /* timeline cards: a gentler sway on their thread */
  @keyframes pf-sway {
    0%   { transform: rotate(0deg); }
    16%  { transform: rotate(3.2deg); }
    36%  { transform: rotate(-2.2deg); }
    56%  { transform: rotate(1.2deg); }
    76%  { transform: rotate(-0.5deg); }
    100% { transform: rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
